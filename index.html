<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>4問でわかる MBTI 性格診断</title>
<style>
  :root {
    --bg: #f5efe2;
    --bg-2: #ece3cf;
    --ink: #2a2418;
    --ink-soft: #5a5140;
    --paper: #fffaf0;
    --line: #2a2418;
    --accent-e: #e87a4a;   /* E 外向: 朱 */
    --accent-i: #5a8bb0;   /* I 内向: 青 */
    --accent-s: #8aa85c;   /* S 感覚: 緑 */
    --accent-n: #a56ab3;   /* N 直感: 紫 */
    --accent-t: #3a6a7a;   /* T 思考: 青緑 */
    --accent-f: #d98a7a;   /* F 感情: 桃 */
    --accent-j: #c9a13a;   /* J 判断: 黄 */
    --accent-p: #6ab3a8;   /* P 知覚: 若葉 */
    --yellow: #f5d76e;
    --shadow: 0 2px 0 rgba(42,36,24,0.9);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.5), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(232,122,74,.12), transparent 40%);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "YuGothic", "Rounded Mplus 1c", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: 0.02em;
  }
  body { overflow-x: hidden; }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    min-height: 100vh;
    position: relative;
  }

  /* ---------- Header ---------- */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 2px 18px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.08em;
  }
  .logo-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent-e);
    border: 1.5px solid var(--ink);
  }
  .back-btn {
    background: transparent;
    border: none;
    font: inherit;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
  }
  .back-btn:hover { background: rgba(0,0,0,.05); }

  /* ---------- Screens ---------- */
  .screen {
    display: none;
    animation: fadeUp .5s cubic-bezier(.2,.8,.2,1);
  }
  .screen.active { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Start ---------- */
  .hero {
    text-align: center;
    padding: 40px 8px 8px;
  }
  .hero-eyebrow {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 5px 14px;
    background: var(--paper);
  }
  .hero h1 {
    margin: 22px 0 10px;
    font-size: clamp(34px, 7vw, 54px);
    line-height: 1.15;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .hero h1 .accent { color: var(--accent-e); }
  .hero p.lead {
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 34ch;
    margin: 10px auto 28px;
    line-height: 1.7;
    text-wrap: pretty;
  }

  .hero-art {
    margin: 24px auto 8px;
    width: min(320px, 72vw);
    aspect-ratio: 1 / 1;
    position: relative;
  }
  .hero-art svg { width: 100%; height: 100%; display: block; }
  .float { animation: float 6s ease-in-out infinite; }
  .float.b { animation-delay: -2s; }
  .float.c { animation-delay: -4s; }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }

  /* ---------- Button ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 28px;
    background: var(--ink);
    color: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 rgba(42,36,24,.9); }
  .btn:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(42,36,24,.9); }
  .btn.ghost { background: var(--paper); color: var(--ink); }
  .btn.accent { background: var(--accent-e); color: var(--paper); }
  .btn-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .meta-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 22px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .meta-row span b { color: var(--ink); font-weight: 700; }

  /* ---------- Question ---------- */
  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 2px 24px;
  }
  .progress-bar {
    flex: 1;
    height: 10px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent-e);
    width: 0%;
    transition: width .5s cubic-bezier(.2,.8,.2,1);
    border-right: 1.5px solid var(--ink);
  }
  .progress-text {
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    min-width: 40px;
    text-align: right;
  }
  .q-number {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .q-title {
    font-size: clamp(24px, 4.5vw, 30px);
    line-height: 1.45;
    margin: 8px 0 28px;
    text-wrap: balance;
  }

  .choices {
    display: grid;
    gap: 14px;
  }
  .choice {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 20px;
    text-align: left;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease, background .2s;
    width: 100%;
  }
  .choice:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 0 rgba(42,36,24,.9);
  }
  .choice:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(42,36,24,.9); }
  .choice-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: grid; place-items: center;
    border: 1.5px solid var(--ink);
    flex-shrink: 0;
    background: var(--yellow);
  }
  .choice-icon svg { width: 28px; height: 28px; }
  .choice-text { display: flex; flex-direction: column; gap: 2px; line-height: 1.4; }
  .choice-text b { font-weight: 700; }
  .choice-text small { font-size: 12px; color: var(--ink-soft); }
  .choice.selected {
    background: var(--yellow);
  }

  /* ---------- Result ---------- */
  .result-head {
    text-align: center;
    margin-top: 10px;
  }
  .result-label {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .result-type {
    font-size: clamp(46px, 10vw, 72px);
    line-height: 1;
    letter-spacing: 0.05em;
    font-weight: 800;
    margin: 4px 0 2px;
  }
  .result-nick {
    font-size: clamp(18px, 3.5vw, 22px);
    margin: 4px 0 0;
    font-weight: 700;
    color: var(--accent-e);
  }
  .result-catch {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 10px 0 0;
    letter-spacing: 0.06em;
  }
  .char-wrap {
    margin: 18px auto;
    width: min(320px, 72vw);
    aspect-ratio: 1 / 1;
    position: relative;
    display: grid;
    place-items: center;
  }
  .char-bg {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: var(--yellow);
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .char-bg::after {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(-20deg,
        transparent 0 18px,
        rgba(255,255,255,.35) 18px 20px);
    opacity: .6;
  }
  .char-svg {
    position: relative;
    width: 86%;
    height: 86%;
    z-index: 2;
  }
  .char-svg svg { width: 100%; height: 100%; display: block; }
  .bob { animation: bob 4s ease-in-out infinite; transform-origin: center bottom; }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-1deg); }
    50%     { transform: translateY(-6px) rotate(1deg); }
  }

  .axes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 22px 0 6px;
  }
  .axis {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }
  .axis-pill {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.08em;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--yellow);
    border: 1.5px solid var(--ink);
    min-width: 36px;
    text-align: center;
  }
  .axis-label { color: var(--ink-soft); font-size: 12px; line-height: 1.3; }
  .axis-label b { color: var(--ink); font-size: 13px; display: block; }

  /* ---------- Detail ---------- */
  .detail-head {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 4px 0 18px;
  }
  .detail-head .mini-char {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--yellow);
    border: 1.5px solid var(--ink);
    flex-shrink: 0;
    overflow: hidden;
    display: grid; place-items: center;
  }
  .detail-head .mini-char svg { width: 80%; height: 80%; }
  .detail-head h2 {
    margin: 0;
    font-size: 22px;
    line-height: 1.25;
  }
  .detail-head small {
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 2px;
  }

  .detail-section {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .detail-section h3 {
    margin: 0 0 10px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.04em;
  }
  .detail-section h3 .marker {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent-e);
    border: 1.5px solid var(--ink);
  }
  .detail-section ul {
    margin: 0;
    padding-left: 0;
    list-style: none;
    display: grid;
    gap: 6px;
  }
  .detail-section li {
    display: flex;
    gap: 8px;
    font-size: 14px;
    line-height: 1.65;
  }
  .detail-section li::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink); flex-shrink: 0; margin-top: 9px;
  }
  .detail-section p {
    margin: 0;
    font-size: 14px;
    line-height: 1.8;
    color: var(--ink);
  }
  .compat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 8px;
  }
  .compat-cell {
    border: 1.5px solid var(--ink);
    background: var(--bg);
    border-radius: 10px;
    padding: 8px 4px;
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.05em;
  }
  .compat-cell small { display: block; font-size: 10px; font-weight: 500; color: var(--ink-soft); margin-top: 2px; letter-spacing: 0.08em; }
  .compat-cell.good { background: var(--accent-p); color: var(--paper); }
  .compat-cell.ok { background: var(--yellow); }

  .detail-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* ---------- Tweaks panel ---------- */
  #tweaks {
    position: fixed;
    right: 16px; bottom: 16px;
    width: 260px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 6px 0 rgba(42,36,24,.9);
    z-index: 50;
    font-size: 13px;
    display: none;
  }
  #tweaks.open { display: block; }
  #tweaks h4 { margin: 0 0 10px; font-size: 13px; letter-spacing: 0.1em; }
  #tweaks label { display: block; margin: 10px 0 4px; color: var(--ink-soft); font-size: 11px; letter-spacing: 0.08em; }
  #tweaks .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  #tweaks .swatch {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.5px solid var(--ink);
    cursor: pointer;
  }
  #tweaks .swatch.active { outline: 2px solid var(--ink); outline-offset: 2px; }
  #tweaks select {
    width: 100%;
    padding: 6px 8px;
    border: 1.5px solid var(--ink);
    border-radius: 8px;
    background: var(--bg);
    font: inherit;
    font-size: 12px;
  }

  /* ---------- Footer ---------- */
  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }

  @media (max-width: 480px) {
    .app { padding: 16px 16px 60px; }
    .hero { padding-top: 20px; }
    .char-wrap { margin: 12px auto; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- top bar -->
  <div class="top-bar">
    <div class="logo">
      <span class="logo-dot"></span>
      <span>TYPE·FOUR</span>
    </div>
    <button class="back-btn" id="backBtn" style="visibility:hidden;">← もどる</button>
  </div>

  <!-- ============ SCREEN 1: START ============ -->
  <section class="screen active" id="screen-start">
    <div class="hero">
      <span class="hero-eyebrow">4問で わかる</span>
      <h1>あなたは<br>どの<span class="accent">性格タイプ</span>？</h1>
      <p class="lead">4つの質問に答えるだけで、<br>16タイプの中から あなたの性格を診断します。<br>所要時間およそ 1 分。</p>

      <div class="hero-art">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <!-- background circle -->
          <circle cx="100" cy="100" r="92" fill="#fffaf0" stroke="#2a2418" stroke-width="2"/>
          <!-- 4 floating character heads representing 4 archetypes -->
          <g class="float">
            <circle cx="62" cy="70" r="22" fill="#e87a4a" stroke="#2a2418" stroke-width="2"/>
            <circle cx="56" cy="68" r="2.3" fill="#2a2418"/>
            <circle cx="68" cy="68" r="2.3" fill="#2a2418"/>
            <path d="M55 76 Q62 82 69 76" fill="none" stroke="#2a2418" stroke-width="2" stroke-linecap="round"/>
          </g>
          <g class="float b">
            <circle cx="138" cy="74" r="22" fill="#5a8bb0" stroke="#2a2418" stroke-width="2"/>
            <rect x="128" y="66" width="8" height="4" rx="2" fill="#2a2418"/>
            <rect x="140" y="66" width="8" height="4" rx="2" fill="#2a2418"/>
            <path d="M131 80 Q138 78 145 80" fill="none" stroke="#2a2418" stroke-width="2" stroke-linecap="round"/>
          </g>
          <g class="float c">
            <circle cx="62" cy="140" r="22" fill="#8aa85c" stroke="#2a2418" stroke-width="2"/>
            <path d="M52 138 L60 134 M64 134 L72 138" stroke="#2a2418" stroke-width="2" stroke-linecap="round" fill="none"/>
            <circle cx="56" cy="140" r="2" fill="#2a2418"/>
            <circle cx="68" cy="140" r="2" fill="#2a2418"/>
            <path d="M55 148 Q62 152 69 148" fill="none" stroke="#2a2418" stroke-width="2" stroke-linecap="round"/>
          </g>
          <g class="float">
            <circle cx="138" cy="142" r="22" fill="#a56ab3" stroke="#2a2418" stroke-width="2"/>
            <circle cx="132" cy="140" r="2.3" fill="#2a2418"/>
            <circle cx="144" cy="140" r="2.3" fill="#2a2418"/>
            <path d="M132 150 Q138 146 144 150" fill="none" stroke="#2a2418" stroke-width="2" stroke-linecap="round"/>
            <path d="M120 122 L128 128" stroke="#2a2418" stroke-width="2"/>
          </g>
          <!-- centre "?" -->
          <circle cx="100" cy="106" r="14" fill="#f5d76e" stroke="#2a2418" stroke-width="2"/>
          <text x="100" y="112" text-anchor="middle" font-size="18" font-weight="800" fill="#2a2418" font-family="Georgia, serif">?</text>
        </svg>
      </div>

      <button class="btn accent" id="startBtn">
        はじめる
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 8h8M9 5l3 3-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="meta-row">
        <span><b>4</b> つの質問</span>
        <span><b>16</b> タイプ</span>
        <span>所要時間 <b>1分</b></span>
      </div>
    </div>
  </section>

  <!-- ============ SCREEN 2: QUESTIONS ============ -->
  <section class="screen" id="screen-question">
    <div class="progress">
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      <div class="progress-text" id="progText">1 / 4</div>
    </div>
    <div class="q-number" id="qNumber">QUESTION 01</div>
    <h2 class="q-title" id="qTitle">—</h2>
    <div class="choices" id="choices"></div>
  </section>

  <!-- ============ SCREEN 3: RESULT ============ -->
  <section class="screen" id="screen-result">
    <div class="result-head">
      <div class="result-label" id="resLabel">あなたのタイプ</div>
      <div class="result-type" id="resType">INFP</div>
      <div class="result-nick" id="resNick">—</div>
      <div class="result-catch" id="resCatch">—</div>
    </div>
    <div class="char-wrap">
      <div class="char-bg"></div>
      <div class="char-svg bob" id="charSvg"></div>
    </div>
    <div class="axes" id="axes"></div>
    <div class="btn-row" style="margin-top: 22px;">
      <button class="btn ghost" id="retryBtn">もう一度</button>
      <button class="btn accent" id="detailBtn">
        くわしく見る
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 8h8M9 5l3 3-3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ SCREEN 4: DETAIL ============ -->
  <section class="screen" id="screen-detail">
    <div class="detail-head">
      <div class="mini-char" id="miniChar"></div>
      <div>
        <small id="detType">INFP · なかまいしの夢想家</small>
        <h2 id="detTitle">—</h2>
      </div>
    </div>

    <div class="detail-section">
      <h3><span class="marker"></span>このタイプって？</h3>
      <p id="detDesc">—</p>
    </div>

    <div class="detail-section">
      <h3><span class="marker" style="background:var(--accent-p)"></span>強み</h3>
      <ul id="detStrengths"></ul>
    </div>

    <div class="detail-section">
      <h3><span class="marker" style="background:var(--accent-f)"></span>注意したいところ</h3>
      <ul id="detWeak"></ul>
    </div>

    <div class="detail-section">
      <h3><span class="marker" style="background:var(--accent-n)"></span>向いている活動</h3>
      <ul id="detCareer"></ul>
    </div>

    <div class="detail-section">
      <h3><span class="marker" style="background:var(--accent-j)"></span>相性のいいタイプ</h3>
      <div class="compat-grid" id="detCompat"></div>
    </div>

    <div class="detail-actions">
      <button class="btn ghost" id="backToResult">← 結果にもどる</button>
      <button class="btn" id="restartBtn">最初から</button>
    </div>
  </section>

  <div class="footer">TYPE·FOUR — a tiny MBTI style diagnosis</div>
</div>

<!-- Tweaks panel -->
<div id="tweaks">
  <h4>Tweaks</h4>
  <label>アクセントカラー</label>
  <div class="swatches" id="accentSwatches"></div>
  <label>書体</label>
  <select id="fontSelect">
    <option value="maru">Maru Gothic（まる）</option>
    <option value="yu">Yu Gothic（ゆう）</option>
    <option value="mincho">Mincho（明朝）</option>
    <option value="mono">Monospace</option>
  </select>
  <label>テスト用：タイプを表示</label>
  <select id="forceType">
    <option value="">—</option>
  </select>
</div>

<script id="tweak-defaults" type="application/json">
/*EDITMODE-BEGIN*/{
  "accent": "#e87a4a",
  "fontFamily": "maru"
}/*EDITMODE-END*/
</script>

<script src="mbti-data.js"></script>
<script src="mbti-characters.js"></script>
<script src="mbti-app.js"></script>

</body>
</html>
